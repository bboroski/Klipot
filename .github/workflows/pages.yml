name: Deploy Klipot portal

on:
  push:
    branches: [main]
    paths: ["index.html", "web/**", "assets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portal assets and controls
        run: |
          test -s index.html
          test -s assets/nun-mesh-overview.svg
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("assets/nun-mesh-overview.svg")
          html = open("index.html", encoding="utf-8").read()
          for marker in ("project-grid", "arena-alloc", "co-start", "health-heartbeat", "gate-validate"):
              assert marker in html, f"missing UI control: {marker}"
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
