name: Deploy Klipot portal

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "favicon.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate portal files and key interactions
        run: |
          test -s index.html
          test -s assets/sambu-ecosystem-overview.svg
          test -s assets/portal-ui-preview.svg
          test -s assets/klipot-mark.svg
          test -s assets/duck-ui/duck-ui.css
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for path in (
              "assets/sambu-ecosystem-overview.svg",
              "assets/portal-ui-preview.svg",
              "assets/klipot-mark.svg",
          ):
              ET.parse(path)

          html = Path("index.html").read_text(encoding="utf-8")
          for marker in (
              'id="project-grid"',
              'id="arena-alloc"',
              'id="co-start"',
              'id="health-heartbeat"',
              'id="gate-validate"',
              'data-copy="git clone https://github.com/bboroski/Klipot.git"',
              'class="feature-grid"',
              'href="assets/duck-ui/duck-ui.css"',
              'id="workspace-density"',
              'id="workspace-cycle"',
              'id="workspace-material"',
              'name:"Fragile-Baby"',
              'name:"Luci"',
          ):
              assert marker in html, f"missing portal marker: {marker}"

          script = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert script, "missing inline application script"
          Path("/tmp/klipot-inline.js").write_text(script[-1], encoding="utf-8")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript syntax
        run: node --check /tmp/klipot-inline.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
