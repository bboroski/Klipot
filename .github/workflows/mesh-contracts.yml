name: Cross-repository mesh contract check

on:
  pull_request:
    paths:
      - "contracts/**"
      - "tests/**"
      - "assets/**"
      - "ecosystem/**"
      - "README*"
      - "docs/**"
      - "registry/**"
      - "index.html"
      - "web/**"
      - ".satan/**"
      - ".github/workflows/satan.yml"
      - ".github/workflows/mesh-contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "tests/**"
      - "assets/**"
      - "ecosystem/**"
      - "README*"
      - "docs/**"
      - "registry/**"
      - "index.html"
      - "web/**"
      - ".satan/**"
      - ".github/workflows/satan.yml"
      - ".github/workflows/mesh-contracts.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Klipot
        uses: actions/checkout@v4
        with:
          path: Klipot
      - name: Checkout Kloz
        uses: actions/checkout@v4
        with:
          repository: bboroski/Kloz
          path: Kloz
      - name: Checkout CO
        uses: actions/checkout@v4
        with:
          repository: bboroski/CO
          path: CO
      - name: Checkout SaintSI
        uses: actions/checkout@v4
        with:
          repository: bboroski/SaintSI
          path: SaintSI
      - name: Checkout ReaperCripple
        uses: actions/checkout@v4
        with:
          repository: bboroski/ReaperCripple
          path: ReaperCripple
      - name: Checkout SAMBU
        uses: actions/checkout@v4
        with:
          repository: bboroski/SAMBU
          path: SAMBU
      - name: Checkout ToolNG
        uses: actions/checkout@v4
        with:
          repository: bboroski/ToolNG
          path: ToolNG
      - name: Checkout NUN
        uses: actions/checkout@v4
        with:
          repository: bboroski/NUN
          path: NUN
      - name: Checkout NUNLauncher
        uses: actions/checkout@v4
        with:
          repository: bboroski/NUNLauncher
          path: NUNLauncher
      - name: Checkout Fragile-Baby
        uses: actions/checkout@v4
        with:
          repository: bboroski/Fragile-Baby
          path: Fragile-Baby
      - name: Checkout Luci
        uses: actions/checkout@v4
        with:
          repository: bboroski/Luci
          path: Luci
      - name: Set up Node for portal syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile the optional cross-project headers
        run: |
          cc -std=c11 -Wall -Wextra -pedantic -fsyntax-only \
            -IKlipot/contracts \
            -IKloz/include -ICO/include -ISaintSI/include \
            -IReaperCripple/include \
            Klipot/tests/mesh_header_smoke.c
      - name: Validate every repository manifest and README diagram
        run: python Klipot/tests/validate_mesh.py
      - name: Validate the Klipot registry JSON
        run: python -m json.tool Klipot/registry/ecosystem.json > /dev/null
      - name: Validate every repository manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          repos = ["Klipot", "Kloz", "CO", "SaintSI", "ReaperCripple", "SAMBU", "ToolNG"]
          for repo in repos:
              path = Path(repo) / ("registry/ecosystem.json" if repo == "Klipot" else "ecosystem/manifest.json")
              json.loads(path.read_text(encoding="utf-8"))
              print("valid:", path)
          PY
