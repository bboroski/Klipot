<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1093" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Klipot modular systems map</title>
<desc id="desc">Klipot indexes nine repositories: six core engineering modules, Klipot, and the documentation-only NUN and NUNLauncher operating-system specifications.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141414"/><stop offset="1" stop-color="#0D0D0D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BFA100"/><stop offset="1" stop-color="#BFA100"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#262626"/><stop offset="1" stop-color="#1A1A1A"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="15" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#BFA100" stroke-opacity=".07" stroke-width="1"/></pattern>
</defs>
<rect width="1440" height="820" rx="32" fill="url(#canvas)"/>
<rect width="1440" height="820" rx="32" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="72" y="68" fill="#FFD600" font-size="12" font-weight="800" letter-spacing="4">KLIPOT / SYSTEM MAP</text>
  <text x="72" y="98" fill="#E6E6E6" font-size="18">Independent cores. Explicit boundaries. One operator-facing control plane.</text>
  <g fill="none" stroke="#FFD600" stroke-opacity=".62" stroke-width="2">
    <path d="M720 410L276 220"/><path d="M720 410L720 230"/><path d="M720 410L1164 220"/>
    <path d="M720 410L276 610"/><path d="M720 410L720 640"/><path d="M720 410L1164 610"/>
  </g>
  <g fill="none" stroke="#FFD600" stroke-opacity=".25" stroke-width="1" stroke-dasharray="5 8">
    <circle cx="720" cy="410" r="245"/><circle cx="720" cy="410" r="285"/>
  </g>
  <g>
    <rect x="82" y="135" width="388" height="156" rx="20" fill="url(#card)" stroke="#BFA100" stroke-width="1.5"/>
    <rect x="526" y="112" width="388" height="156" rx="20" fill="url(#card)" stroke="#BFA100" stroke-width="1.5"/>
    <rect x="970" y="135" width="388" height="156" rx="20" fill="url(#card)" stroke="#BFA100" stroke-width="1.5"/>
    <rect x="82" y="526" width="388" height="156" rx="20" fill="url(#card)" stroke="#BFA100" stroke-width="1.5"/>
    <rect x="526" y="572" width="388" height="156" rx="20" fill="url(#card)" stroke="#BFA100" stroke-width="1.5"/>
    <rect x="970" y="526" width="388" height="156" rx="20" fill="url(#card)" stroke="#BFA100" stroke-width="1.5"/>
  </g>
  <g fill="#FFD600">
    <circle cx="112" cy="166" r="6"/><circle cx="556" cy="143" r="6"/><circle cx="1000" cy="166" r="6"/>
    <circle cx="112" cy="557" r="6"/><circle cx="556" cy="603" r="6"/><circle cx="1000" cy="557" r="6"/>
  </g>
  <g fill="#E6E6E6" font-size="27" font-weight="800">
    <text x="136" y="176">Kloz</text><text x="580" y="153">CO</text><text x="1024" y="176">SaintSI</text>
    <text x="136" y="567">ReaperCripple</text><text x="580" y="613">SAMBU</text><text x="1024" y="567">ToolNG</text>
  </g>
  <g fill="#999999" font-size="15">
    <text x="112" y="213">Platform ABI · bounded memory</text><text x="556" y="190">Deterministic lifecycle · bounded poll</text><text x="1000" y="213">Heartbeat · runtime assurance</text>
    <text x="112" y="604">BSP · calibration · factory · MES</text><text x="556" y="650">Language · IDE · workflows · Studio</text><text x="1000" y="604">Windows diagnostics · local evidence</text>
  </g>
  <g fill="#FFD600" font-size="10" font-weight="800" letter-spacing="1.4">
    <text x="112" y="255">PLATFORM SUBSTRATE</text><text x="556" y="232">LIFECYCLE RUNTIME</text><text x="1000" y="255">ASSURANCE LAYER</text>
    <text x="112" y="646">HARDWARE INTEGRATION</text><text x="556" y="692">DEVELOPER TOOLCHAIN</text><text x="1000" y="646">OPERATOR TOOLING</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="720" cy="410" r="132" fill="#1A1A1A" stroke="url(#accent)" stroke-width="5"/>
  </g>
  <circle cx="720" cy="410" r="108" fill="#141414" stroke="#FFD600" stroke-opacity=".32" stroke-width="1.5"/>
  <path d="M666 344L720 314L774 344V406L720 437L666 406Z" fill="#FFD600" opacity=".12" stroke="#FFD600" stroke-width="1.5"/>
  <text x="720" y="389" fill="#E6E6E6" text-anchor="middle" font-size="35" font-weight="900" letter-spacing="2">KLIPOT</text>
  <text x="720" y="419" fill="#FFD600" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="3">CONTROL PLANE</text>
  <text x="720" y="508" fill="#E6E6E6" text-anchor="middle" font-size="13">Registry · contracts · discovery · browser labs</text>
  <text x="720" y="747" fill="#FFD600" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1">NUN + NUNLauncher · DOCUMENTATION-ONLY OS SPECIFICATIONS</text>
  <text x="720" y="773" fill="#999999" text-anchor="middle" font-size="11" letter-spacing="1.5">NO HIDDEN GLOBALS · NO FORCED RUNTIME COUPLING · OWNERSHIP STAYS LOCAL</text>
</g>
</svg>